<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CutFlow engine-dev(M3a)</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 16px; }
  #canvas-host { max-width: 960px; border: 1px solid #444; line-height: 0; }
  #canvas-host canvas { display: block; }
  #controls { margin: 12px 0; display: flex; align-items: center; gap: 8px; }
  #seek { flex: 1; }
  #hud { background: #000; padding: 8px; font-size: 12px; white-space: pre; overflow: auto; max-height: 300px; }
  #status { color: #9cf; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="status">読み込み中…</div>
<div id="canvas-host"></div>
<div id="controls">
  <button id="play">play</button>
  <input id="seek" type="range" value="0" />
</div>
<pre id="hud"></pre>
<script src="/engine-dev/bundle.js"></script>
</body>
</html>
